baseURL: 'https://zzzxy.qzz.io/'
title: '我的博客'
theme: 'PaperMod'
languageCode: 'zh-CN'
hasCJKLanguage: true
canonifyURLs: true
relativeURLs: false
uglyURLs: false

outputs:
  home:
    - HTML
    - RSS

menu:
  main:
    - identifier: home
      name: 🏠 首页
      url: /
      weight: 10
    - identifier: posts
      name: 📝 文章
      url: /posts/
      weight: 20
    - identifier: categories
      name: 🗂️ 分类
      url: /categories/
      weight: 30
    - identifier: tags
      name: 🏷️ 标签
      url: /tags/
      weight: 40
    - identifier: archives
      name: 📅 归档
      url: /archives/
      weight: 50
    - identifier: about
      name: ℹ️ 关于
      url: /about/
      weight: 60

params:
  description: '个人技术博客，分享编程学习和开发经验'
  
  # =============== 完整的个人资料配置 ===============
  profileMode:
    enabled: true
    title: "技术博主"
    subtitle: "持续学习 | 热爱分享"
    imageUrl: "https://avatars.githubusercontent.com/u/583231?v=4"  # 示例头像URL
    imageTitle: "我的头像"
    imageWidth: 160
    imageHeight: 160
    buttons:
      - name: "📖 查看文章"
        url: "/posts/"
      - name: "⭐ GitHub"
        url: "https://github.com/Zzz12138zz"
  
  # =============== 主页欢迎信息 ===============
  homeInfoParams:
    Title: "🚀 欢迎来到我的技术博客"
    Content: >
      这里是我记录技术学习、项目经验和思考的地方。
      
      **✨ 博客特色**：
      - 📖 实用的技术教程与笔记
      - 💡 前沿技术探索与实践  
      - 🔧 开发工具与效率提升
      - 🎯 项目复盘与经验总结
      
      **🔍 快速导航**：
      - [所有文章](/posts/) - 查看全部内容
      - [分类浏览](/categories/) - 按主题分类
      - [标签云](/tags/) - 关键词索引
      
      📧 **联系交流**：xywlkjgzs@sina.com
  
  # =============== 社交链接 ===============
  socialIcons:
    - name: github
      url: "https://github.com/Zzz12138zz"
      title: "GitHub"
    - name: email
      url: "mailto:xywlkjgzs@sina.com"
      title: "发送邮件"
    - name: rss
      url: "/index.xml"
      title: "RSS订阅"
  
  # =============== 显示功能 ===============
  ShowReadingTime: true
  ShowShareButtons: true
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowWordCount: true
  ShowTableOfContents: true
  ShowTaxonomies: true
  
  # =============== 主题设置 ===============
  defaultTheme: auto
  displayFullLangName: true
  
  # =============== 分页 ===============
  pagination:
    pagerSize: 5
    enable: true

# =============== 语法高亮配置 ===============
markup:
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    style: 'monokai'
    tabWidth: 4
    
  goldmark:
    renderer:
      unsafe: true
      hardWraps: false
      xHTML: false

# =============== 分类标签 ===============
taxonomies:
  category: 'categories'
  tag: 'tags'

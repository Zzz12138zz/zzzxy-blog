    # ============================================
    #                    高级功能
    # ============================================
    # TypeIt打字机效果配置
    [languages.zh-cn.params.typeit]
      # 每个字符的打字速度（毫秒）
      speed = 100
      
      # 光标闪烁速度（毫秒）

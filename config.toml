# ============================================
# 这些配置在所有语言间共享
# 如果需要在特定语言中覆盖，可以在语言块中重新定义

[params]
  # 赞赏配置
  [params.sponsor]
    enable = false
    bio = "如果你觉得这篇文章对你有所帮助，欢迎赞赏~"
    link = "https://www.buymeacoffee.com"
    custom = ""
  
  # 网站验证代码，用于Google/Bing/Yandex/Pinterest/Baidu
  [params.verification]
    google = ""
    bing = ""
    yandex = ""
    pinterest = ""
    baidu = ""
    so = ""
    sogou = ""
  
  # 网站SEO配置
  [params.seo]
    # 图片URL
    image = ""
    # 缩略图URL
    thumbnailUrl = ""
    # Google搜索结果中网站备用名字
    alternateName = ["Hugo DoIt"]
  
  # Cookie许可配置
  [params.cookieconsent]
    enable = false
    [params.cookieconsent.content]
      message = ""
      dismiss = ""
      link = ""
  
  # 第三方库文件的CDN设置
  [params.cdn]
    # CDN数据文件名称
    data = ""
  
  # 兼容性设置
  [params.compatibility]
    # 是否使用Polyfill.io来兼容旧式浏览器
    polyfill = false
  
  # 应用图标配置
  [params.app]
    # 当添加到iOS主屏幕或者Android启动器时的标题
    title = "DoIt"
    # 是否隐藏网站图标资源链接
    noFavicon = false
    # 更现代的SVG网站图标
    svgFavicon = "/svgs/edit.svg"
    # Safari图标颜色
    iconColor = "#5bbad5"
    # Windows v8-10磁贴颜色
    tileColor = "#da532c"
  
  # 图片处理配置
  [params.image]
    # 是否缓存远程图片到本地
    cacheRemote = true
    # 是否优化图片
    optimise = true
    # [试验性功能] 缓存markdown中的图片链接到本地
    cacheRemoteImages = true
    # [试验性功能] 使用hugo自带的图片处理功能生成srcset属性
    optimizeImages = true
    # [实验性功能] optimizeImages中srcset属性的缩放方法
    srcsetSmallResizeMethod = "700x webp Lanczos q75"
    srcsetDefaultResizeMethod = "1200x webp Lanczos q75"
    srcsetLargeResizeMethod = "2000x webp Lanczos q75"

# ============================================
#                    Hugo内部配置
# ============================================

# Markdown解析设置
[markup]
  # 语法高亮设置
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    # false是必要的设置
    noClasses = false
  
  # Goldmark是Hugo 0.60以来的默认Markdown解析库
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      linkify = true
      strikethrough = true
      table = true
      taskList = true
      typographer = true
    
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]']]
        inline = [['\(', '\)']]
    
    [markup.goldmark.renderer]
      # 是否在文档中直接使用HTML标签
      unsafe = true
  
  # 目录设置
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 6

# 网站地图配置
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# 永久链接格式
[Permalinks]
  # 文章永久链接格式
  posts = ":contentbasename"

# 用于输出Markdown格式文档的设置
[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]

# 用于输出Markdown格式文档的设置
[outputFormats.MarkDown]
  mediaType = "text/plain"
  isPlainText = true
  isHTML = false

# 用于Hugo输出文档的设置
[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML", "MarkDown"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]

# 分类系统配置
[taxonomies]
  author = "authors"
  category = "categories"
  tag = "tags"
  series = "series"

# 隐私信息配置
[privacy]
  [privacy.youtube]
    privacyEnhanced = true
  
  [privacy.x]
    enableDNT = true


# ============================================
#                    Hugo 基础配置
# ============================================

# 网站基础URL，用于生成绝对链接
baseURL = "https://zzzxy.qzz.io/"

# 默认内容语言（必须设置）
# 当用户访问根域名时，将重定向到此语言版本
defaultContentLanguage = "zh-cn"

# 全局网站标题（可以被语言特定的标题覆盖）
title = "Zzz's Blog"

# 使用的主题名称
theme = "DoIt"

# ============================================
#                    多语言配置
# ============================================
# 在此块中定义所有支持的语言
# 每种语言可以有独立的配置，如标题、菜单、参数等

[languages]
  # ============================================
  #                    中文配置
  # ============================================
  # 这是默认语言（与上面的 defaultContentLanguage 对应）
  
  [languages.zh-cn]
    # 在语言选择器中的权重（数字越小越靠前）
    weight = 1
    
    # 网站标题（中文版）
    title = "Zzz's 碎碎念"
    
    # 网站语言代码（影响HTML的lang属性）
    languageCode = "zh-CN"
    
    # 显示在语言选择器中的语言名称
    languageName = "简体中文"
    
    # 是否包含中日韩文字（影响分词和搜索）
    hasCJKLanguage = true
    
    # ============================================
    #                    网站元数据
    # ============================================
    # 这些参数可以针对每种语言单独设置
    
    [languages.zh-cn.params]
      # 网站描述，用于SEO和社交分享
      description = "这里是Zzz的个人博客，记录技术学习、生活感悟和项目分享"
      
      # 网站关键词，用于SEO
      keywords = ["Zzz", "技术博客", "编程", "学习笔记", "个人博客"]
      
      # DoIt主题版本
      version = "0.4.X"
      
      # 默认主题模式：light(亮色)、dark(暗色)、black(纯黑)、auto(自动)
      defaultTheme = "auto"
      
      # 日期显示格式（Go语言时间格式）
      dateFormat = "2006-01-02"
    
    # ============================================
    #                    作者信息
    # ============================================
    [languages.zh-cn.params.author]
      # 作者姓名
      name = "Zzz"
      
      # 作者邮箱
      email = "xywlkjgzs@sina.com"
      
      # 头像图片路径（相对于static目录）
      avatar = "/imgs/avatar.jpg"
      
      # 作者个人主页链接
      link = "/authors/zzz"
      
      # Gravatar邮箱，用于获取头像
      gravatarEmail = ""
    
    # ============================================
    #                    导航菜单
    # ============================================
    # 中文版导航菜单
    
    [[languages.zh-cn.menu.main]]
      identifier = "home"
      name = "🏠 首页"
      url = "/"
      weight = 1
    
    [[languages.zh-cn.menu.main]]
      identifier = "posts"
      name = "📝 所有文章"
      url = "/posts/"
      weight = 2
    
    [[languages.zh-cn.menu.main]]
      identifier = "tags"
      name = "🏷️ 标签"
      url = "/tags/"
      weight = 3
    
    [[languages.zh-cn.menu.main]]
      identifier = "categories"
      name = "📁 分类"
      url = "/categories/"
      weight = 4
    
    [[languages.zh-cn.menu.main]]
      identifier = "series"
      name = "📚 系列"
      url = "/series/"
      weight = 5
    
    [[languages.zh-cn.menu.main]]
      identifier = "authors"
      name = "👤 作者"
      url = "/authors/"
      weight = 6
    
    [[languages.zh-cn.menu.main]]
      identifier = "links"
      name = "🔗 友链"
      url = "/links/"
      weight = 7
    
    [[languages.zh-cn.menu.main]]
      identifier = "about"
      name = "ℹ️ 关于"
      url = "/about/"
      weight = 8
    
    # ============================================
    #                    网站外观
    # ============================================
    [languages.zh-cn.params.header]
      # 主题切换模式：switch(开关)、select(选择器)
      themeChangeMode = "select"
      
      [languages.zh-cn.params.header.title]
        # 网站标题（显示在导航栏）
        name = "Zzz's 碎碎念"
        
        # 网站LOGO图片路径
        logo = "/svgs/edit_2style.svg"
        
        # 是否为标题启用打字机动画效果
        typeit = false
    
    [languages.zh-cn.params.footer]
      # 是否显示页脚
      enable = true
      
      # 网站创立年份
      since = 2025
      
      # 是否显示"Powered by Hugo & DoIt"
      hugo = false
      
      # 是否显示版权信息
      copyright = true
      
      # 是否显示作者信息
      author = true
      
      # ICP备案号（仅限中国大陆）
      icp = ""
      
      # 内容许可协议
      license = '<a rel="license" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'
      
      # 自定义页脚内容（支持HTML）
      custom = '<div style="font-size: 0.85rem; color: #8a94a6; text-align: center; padding: 5px; line-height: 1.5;">我和小野猫相遇在夏天，而夏天从未离去。</div>'
      
      # 托管平台信息（如GitHub Pages）
      hostedOn = ''
    
    # ============================================
    #                    页面配置
    # ============================================
    # 主页配置（中文版）
    [languages.zh-cn.params.home]
      [languages.zh-cn.params.home.profile]
        # 是否显示个人资料卡
        enable = true
        
        # 头像图片路径
        avatarURL = "/imgs/avatar.jpg"
        
        # 主页显示的网站标题（支持HTML格式）
        title = ""
        
        # 副标题
        subtitle = "欢迎访问我的博客！"
        
        # 是否为副标题启用打字机效果
        typeit = true
        
        # 是否显示社交图标
        social = true
        
        # 免责声明（支持HTML）
        disclaimer = "该站仍在建设中，部分内容可能为测试内容，请知悉！"
      
      [languages.zh-cn.params.home.posts]
        # 是否在主页显示文章列表
        enable = true
        
        # 主页每页显示文章数量
        paginate = 6
        
        # 默认情况下是否在主页隐藏文章
        defaultHiddenFromHomePage = false
    
    # 文章列表页配置（如文章归档页面）
    [languages.zh-cn.params.section]
      # 每页显示文章数量
      paginate = 20
      
      # 日期显示格式（月-日）
      dateFormat = "01-02"
      
      # RSS中显示的文章数量
      rss = 10
      
      # 最近更新文章设置
      [languages.zh-cn.params.section.recentlyUpdated]
        enable = false
        rss = false
        days = 30
        maxCount = 10
    
    # 分类/标签列表页配置
    [languages.zh-cn.params.list]
      paginate = 20
      dateFormat = "01-02"
      rss = 10
    
    # 文章页面配置
    [languages.zh-cn.params.page]
      # 是否在主页隐藏一篇文章
      hiddenFromHomePage = false
      
      # 是否在搜索结果中隐藏一篇文章
      hiddenFromSearch = false
      
      # 是否使用Twitter Emoji
      twemoji = false
      
      # 是否启用lightgallery图片灯箱效果
      lightgallery = false
      
      # 是否启用Ruby注音扩展语法（如<ruby>）
      ruby = true
      
      # 是否启用分数扩展语法（如1/2）
      fraction = true
      
      # 是否显示"查看Markdown源文件"链接
      linkToMarkdown = true
      
      # 是否显示"查看源文件"链接
      linkToSource = false
      
      # 是否显示"编辑此页"链接
      linkToEdit = false
      
      # 是否显示"报告问题"链接
      linkToReport = false
      
      # 是否在RSS中显示全文内容
      rssFullText = false
      
      # 是否在文章开头显示系列导航
      seriesNavigation = true
      
      # 是否启用最后修改时间
      enableLastMod = true
      
      # 是否启用字数统计
      enableWordCount = true
      
      # 是否启用阅读时间估算
      enableReadingTime = true
      
      # 过时文章提示
      [languages.zh-cn.params.page.outdatedArticleReminder]
        enable = true
        # 如果文章最后更新于90天之前，显示提醒
        reminder = 90
        # 如果文章最后更新于180天之前，显示警告
        warning = 180
      
      # 目录设置
      [languages.zh-cn.params.page.toc]
        # 是否显示目录
        enable = true
        
        # 是否保持静态目录（在顶部）
        keepStatic = false
        
        # 是否自动折叠目录
        auto = false
      
      # 代码块设置
      [languages.zh-cn.params.page.code]
        # 默认显示的代码行数（超出部分折叠）
        maxShownLines = 15
        
        # 是否显示行号
        lineNos = true
        
        # 是否启用代码自动换行
        wrap = false
        
        # 是否显示代码块标题栏
        header = true
      
      # 表格配置
      [languages.zh-cn.params.page.table]
        # 是否开启表格排序
        sort = true
      
      # 数学公式设置
      [languages.zh-cn.params.page.math]
        # 是否启用数学公式支持
        enable = true
        
        # 默认块定界符（空值表示使用默认值 $$ 和 \\[）
        blockLeftDelimiter = ""
        blockRightDelimiter = ""
        
        # 默认行内定界符（空值表示使用默认值 $ 和 \\）
        inlineLeftDelimiter = ""
        inlineRightDelimiter = ""
        
        # 是否启用复制TeX代码功能
        copyTex = true
        
        # 是否启用化学方程式支持（mhchem）
        mhchem = true
        
        # 是否使用MathJax代替KaTeX
        mathjax = false
      
      # 文章分享设置
      [languages.zh-cn.params.page.share]
        # 是否启用分享功能
        enable = true
        
        # Twitter分享
        Twitter = true
        
        # Facebook分享
        Facebook = true
        
        # LinkedIn分享
        Linkedin = false
        
        # 微博分享
        Weibo = true
        
        # Line分享
        Line = true
        
        # WhatsApp分享
        Whatsapp = true
        
        # Pinterest分享
        Pinterest = false
        
        # Tumblr分享
        Tumblr = false
        
        # HackerNews分享
        HackerNews = false
        
        # Reddit分享
        Reddit = false
        
        # VK分享
        VK = false
        
        # 邮件分享
        Email = false
        
        # 其他社交平台分享
        Buffer = false
        Xing = false
        Instapaper = false
        Pocket = false
        Digg = false
        Stumbleupon = false
        Flipboard = false
        Renren = false
        Myspace = true
        Blogger = true
        Baidu = false
        Odnoklassniki = false
        Evernote = true
        Skype = false
        Trello = false
        Mix = false
        Mastodon = false
      
      # 评论系统设置
      [languages.zh-cn.params.page.comment]
        enable = true
        
        # Giscus评论系统（基于GitHub Discussions）
        [languages.zh-cn.params.page.comment.giscus]
          enable = true
          
          # 仓库配置
          dataRepo = "Zzz12138zz/blog-comments"
          dataRepoId = "R_kgDOQ4EHGQ"
          
          # 分类配置
          dataCategory = "Announcements"
          dataCategoryId = "DIC_kwDOQ4EHGc4C02W9"
          
          # 映射和功能配置
          dataMapping = "pathname"
          dataStrict = "0"
          dataReactionsEnabled = "1"
          dataEmitMetadata = "0"
          dataInputPosition = "bottom"
          
          # 主题和语言
          lightTheme = "light"
          darkTheme = "dark"
          dataLang = "zh-CN"
          dataLoading = "lazy"
      
      # 第三方库配置
      [languages.zh-cn.params.page.library]
        [languages.zh-cn.params.page.library.css]
          # 自定义CSS文件
          # 示例：customCSS = "css/custom.css"
        
        [languages.zh-cn.params.page.library.js]
          # 自定义JavaScript文件
          # 示例：customJS = "js/custom.js"
      
      # 页面SEO配置
      [languages.zh-cn.params.page.seo]
        # 图片URL数组
        images = []
        
        # 出版者信息
        [languages.zh-cn.params.page.seo.publisher]
          name = ""
          logoUrl = ""
      
      # 相关文章推荐配置
      [languages.zh-cn.params.page.related]
        enable = true
        count = 5
    
    # ============================================
    #                    功能模块
    # ============================================
    # 搜索功能配置
    [languages.zh-cn.params.search]
      # 是否启用搜索功能
      enable = true
      
      # 搜索引擎类型：fuse(本地)、algolia(云端)
      type = "fuse"
      
      # 文章内容最长索引长度
      contentLength = 4000
      
      # 搜索框占位符文本
      placeholder = "搜索文章..."
      
      # 最大搜索结果数量
      maxResultLength = 10
      
      # 结果内容片段长度
      snippetLength = 50
      
      # 搜索结果中高亮部分的HTML标签
      highlightTag = "em"
      
      # 是否在搜索索引中使用基于baseURL的绝对路径
      absoluteURL = false
      
      # Fuse.js搜索配置
      [languages.zh-cn.params.search.fuse]
        # 是否区分大小写
        isCaseSensitive = false
        
        # 最小匹配字符长度
        minMatchCharLength = 2
        
        # 是否查找所有匹配项
        findAllMatches = false
        
        # 期望匹配的位置
        location = 0
        
        # 匹配阈值（0.0=完全匹配，1.0=匹配所有）
        threshold = 0.3
        
        # 匹配距离
        distance = 100
        
        # 是否忽略位置
        ignoreLocation = false
        
        # 是否使用扩展搜索
        useExtendedSearch = false
        
        # 是否忽略字段规范
        ignoreFieldNorm = false
    
